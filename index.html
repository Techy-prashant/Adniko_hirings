<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Adniko hiring landing page" />
  <title>Adniko Hiring Open</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>

  <main class="relative z-10">
    <section class="page-shell">
      <header class="hero">
        <h1 class="headline">Adniko is hiring!</h1>
        <p class="subheadline">Go ahead, Fill the form</p>
      </header>

      <section class="banner-wrap" aria-label="Adniko banner">
        <img
          src="assets/images/adniko-banner.svg"
          alt="Adniko Banner"
          class="banner-image"
          decoding="async"
        />
      </section>

      <section class="form-wrap" aria-label="Google form section">
        <div class="form-actions">
          <p class="form-note">If Google asks you to sign in, use the popup helper below. Sign in there, then come back to this page and the form will refresh automatically.</p>
          <a
            class="signin-button"
            id="signinPopupButton"
            href="https://accounts.google.com/ServiceLogin?continue=https%3A%2F%2Fdocs.google.com%2Fforms%2Fd%2Fe%2F1FAIpQLSd3f8PWCGRct_jpiqt5tOqyt_8boeZ9pxXtkyboOEgcbBAhYg%2Fviewform%3Fembedded%3Dtrue"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open sign-in popup
          </a>
        </div>
        <iframe
          id="hiringFormFrame"
          src="https://docs.google.com/forms/d/e/1FAIpQLSd3f8PWCGRct_jpiqt5tOqyt_8boeZ9pxXtkyboOEgcbBAhYg/viewform?embedded=true"
          title="Adniko Hiring Form"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
        >
          Loading…
        </iframe>
      </section>
    </section>
  </main>

  <script src="./js/main.js"></script>
</body>
</html>
