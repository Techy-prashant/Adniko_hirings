<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Adniko hiring landing page" />
  <title>Adniko Hiring Open</title>
  <meta property="og:title" content="Hiring open!" />
  <meta property="og:description" content="Join our team." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/images/adniko_logo.png" />
  <meta property="og:image:alt" content="Adniko hiring landing page thumbnail" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Hiring open!" />
  <meta name="twitter:description" content="Join our team." />
  <meta name="twitter:image" content="assets/images/adniko_logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>

  <main class="relative z-10">
    <section class="page-shell">
      <header class="hero">
          <div class="brand-copy">
            <h1 class="headline">
            <span class="headline-break">Hiring open!</span>
            </h1>
            <p class="subheadline">Join our team.</p>
        </div>
      </header>

      <section class="banner-wrap" aria-label="Adniko banner">
        <img
          src="assets/images/adniko-banner.svg"
          alt="Adniko Banner"
          class="banner-image"
          decoding="async"
        />
      </section>

      <section class="form-wrap" aria-label="Google form section">
        <iframe
          id="hiringFormFrame"
          src="https://docs.google.com/forms/d/e/1FAIpQLSd3f8PWCGRct_jpiqt5tOqyt_8boeZ9pxXtkyboOEgcbBAhYg/viewform?embedded=true"
          title="Adniko Hiring Form"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        >
          Loading…
        </iframe>
      </section>
    </section>
  </main>
</body>
</html>
